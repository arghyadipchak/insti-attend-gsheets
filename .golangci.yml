version: "2"

run:
  timeout: 5m
  concurrency: 4

linters:
  enable:
    - asciicheck
    - errcheck
    - goprintffuncname
    - govet
    - ineffassign
    - lll
    - misspell
    - nolintlint
    - staticcheck
    - unused
    - whitespace
  settings:
    lll:
      line-length: 100
      tab-width: 4

formatters:
  enable:
    - gofmt
    - goimports
